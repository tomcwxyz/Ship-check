[package]
name = "ship-check-desktop"
version = "0.0.0-alpha.12"
description = "Local-first Ship Check review surface."
authors = ["The Good Ship"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "ship_check_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
wait-timeout = "0.2"
tauri-plugin-opener = "2"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
