name: Desktop alpha release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to release (must match package.json and tauri.conf.json)"
        required: true
        type: string
      confirm:
        description: "Type ALPHA to confirm an unsigned/ad-hoc-signed draft pre-release"
        required: true
        type: string

concurrency:
  group: ship-check-desktop-alpha-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Desktop alpha preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require main, explicit confirmation and matching versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Desktop alpha releases must be dispatched from main."
            exit 1
          fi
          if [[ "$RELEASE_CONFIRMATION" != "ALPHA" ]]; then
            echo "::error::Type ALPHA in the confirmation input."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expected = process.env.EXPECTED_VERSION;
          if (root.version !== expected || tauri.version !== expected || cargo !== expected) {
            console.error(`Version mismatch: root=${root.version}, desktop=${tauri.version}, cargo=${cargo}, expected=${expected}`);
            process.exit(1);
          }
          NODE

      - run: pnpm install
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dogfood
      - name: Validate desktop JavaScript and diagnostics
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/bridge.js
          node --check apps/desktop/ui/components.js
          node --check apps/desktop/ui/diagnostics.js
          node --test apps/desktop/ui/diagnostics.test.mjs
          node --check scripts/generate-desktop-assets.cjs
          node --check scripts/install-deep-scanners.cjs
      - run: pnpm desktop:assets

  create-release:
    name: Create or refresh draft desktop release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or refresh draft pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="ship-check-desktop-v${VERSION}"
          title="Ship Check ${VERSION} · desktop alpha"
          notes="Local-first Ship Check desktop alpha for Windows x64, Linux x64 and macOS Apple Silicon. The matching deterministic engine and pinned Gitleaks 8.30.1 binary are bundled with the app; repository source remains local during normal scans. OSV-Scanner 2.5.1 is also bundled but its dependency-vulnerability lookup is off by default and requires explicit user consent because package identifiers and versions may be queried against OSV. Windows installers are unsigned and the macOS build is ad-hoc signed rather than Apple-notarised, so operating-system warnings may appear. Ship Check findings are evidence for human review, not a security or compliance certification."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $tag already exists and is not a draft; refusing to replace a published release."
              exit 1
            fi
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease \
              --title "$title" \
              --notes "$notes"
          fi

  build:
    name: ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64 desktop
            bundle: nsis
          - platform: ubuntu-latest
            label: Linux x64 desktop
            bundle: deb
          - platform: macos-14
            label: macOS Apple Silicon desktop
            bundle: dmg

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - run: pnpm install
      - run: pnpm build
      - run: pnpm desktop:assets

      - name: Install pinned deep scanners
        shell: bash
        run: |
          set -euo pipefail
          node scripts/install-deep-scanners.cjs
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "apps/desktop/src-tauri/resources/gitleaks.exe" --version
            "apps/desktop/src-tauri/resources/osv-scanner.exe" --version
          else
            "apps/desktop/src-tauri/resources/gitleaks" --version
            "apps/desktop/src-tauri/resources/osv-scanner" --version
          fi

      - name: Ad-hoc sign nested macOS scanners
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - apps/desktop/src-tauri/resources/gitleaks
          codesign --force --sign - apps/desktop/src-tauri/resources/osv-scanner
          codesign --verify --verbose apps/desktop/src-tauri/resources/gitleaks
          codesign --verify --verbose apps/desktop/src-tauri/resources/osv-scanner

      - name: Compile matching local engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/resources
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            engine="apps/desktop/src-tauri/resources/ship-check-engine.exe"
          else
            engine="apps/desktop/src-tauri/resources/ship-check-engine"
          fi
          bun build packages/cli/src/index.ts --compile --outfile "$engine"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$engine"; fi
          "$engine" --version
          "$engine" scan ./test-fixtures/cost-safe --pack cost-aware --fail-on high

          set +e
          "$engine" scan ./test-fixtures/risky-next --pack secure-build --fail-on high
          risky_exit=$?
          set -e
          if [[ "$risky_exit" -ne 2 ]]; then
            echo "::error::Risky fixture should fail the high-severity gate with exit 2; got $risky_exit."
            exit 1
          fi

      - name: Ad-hoc sign matching macOS engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --sign - apps/desktop/src-tauri/resources/ship-check-engine
          codesign --verify --verbose apps/desktop/src-tauri/resources/ship-check-engine

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build desktop bundle
        working-directory: apps/desktop
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: cargo tauri build --bundles "$BUNDLE"

      - name: Upload installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pattern="apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            pattern="apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg"
          else
            pattern="apps/desktop/src-tauri/target/release/bundle/deb/*.deb"
          fi
          shopt -s nullglob
          files=( $pattern )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No desktop installer was produced for $RUNNER_OS."
            exit 1
          fi
          for asset in "${files[@]}"; do
            gh release upload "ship-check-desktop-v${VERSION}" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done
