name: Package CMS connectors
on:
  pull_request:
    paths:
      - 'integrations/wordpress/**'
      - 'integrations/drupal/**'
      - '.github/workflows/cms-connectors-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate connector PHP syntax
        run: |
          set -euo pipefail
          find integrations/wordpress integrations/drupal -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package WordPress plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          cd integrations/wordpress
          zip -qr ../../dist/ship-check-wordpress-connector.zip ship-check-connector
      - name: Package Drupal module
        run: |
          set -euo pipefail
          cd integrations/drupal
          zip -qr ../../dist/ship-check-drupal-connector.zip ship_check_connector
      - name: Upload connector packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ship-check-cms-connectors
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
