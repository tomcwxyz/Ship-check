name: Desktop validate

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-validate.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-validate.yml"

concurrency:
  group: ship-check-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check vanilla desktop modules
        run: |
          node --check apps/desktop/ui/app.js
          node --check apps/desktop/ui/bridge.js
          node --check apps/desktop/ui/components.js

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - name: Check native shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test trusted engine boundary
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml engine::tests
