name: Generate pnpm lockfile

on:
  push:
    branches:
      - chore/pnpm-lockfile
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pnpm-lockfile

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: add pnpm lockfile"
          git push origin HEAD:chore/pnpm-lockfile
