name: Validate

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "test-fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "action.yml"
      - "scripts/github-action.mjs"
      - "scripts/github-action-comparison.mjs"
      - "scripts/github-action-comparison.test.mjs"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/validate.yml"
      - ".github/workflows/engine-alpha-release.yml"
      - ".github/workflows/desktop-alpha-release.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "test-fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "action.yml"
      - "scripts/github-action.mjs"
      - "scripts/github-action-comparison.mjs"
      - "scripts/github-action-comparison.test.mjs"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/validate.yml"
      - ".github/workflows/engine-alpha-release.yml"
      - ".github/workflows/desktop-alpha-release.yml"

concurrency:
  group: ship-check-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Dogfood Ship Check against its own repository
        run: pnpm dogfood
      - name: Compile standalone engine
        run: bun build packages/cli/src/index.ts --compile --outfile dist/ship-check
      - name: Smoke standalone engine
        run: |
          ./dist/ship-check --version
          ./dist/ship-check scan ./test-fixtures/cost-safe --pack cost-aware --fail-on high
          ./dist/ship-check scan ./test-fixtures/cost-safe --pack cost-aware --format metadata > dist/ship-check-metadata.json
          ./dist/ship-check timeline dist/ship-check-metadata.json > dist/ship-check-timeline.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const metadata = JSON.parse(await readFile("dist/ship-check-metadata.json", "utf8"));
          assert.equal(metadata.type, "assurance-metadata");
          assert.match(metadata.project?.identity?.value ?? "", /^[a-f0-9]{64}$/);
          assert.match(metadata.scan?.identity?.value ?? "", /^[a-f0-9]{64}$/);
          assert.match(metadata.scan?.ruleset?.value ?? "", /^[a-f0-9]{64}$/);
          const serialised = JSON.stringify(metadata);
          assert.equal(serialised.includes(process.cwd()), false);
          assert.equal(serialised.includes("test-fixtures/cost-safe"), false);

          const timeline = JSON.parse(await readFile("dist/ship-check-timeline.json", "utf8"));
          assert.equal(timeline.type, "project-history-timeline");
          assert.equal(timeline.eventCount, 1);
          assert.equal(timeline.latestScan?.value, metadata.scan.identity.value);
          assert.equal(timeline.events?.[0]?.continuity, undefined);
          assert.equal(JSON.stringify(timeline).includes(process.cwd()), false);
          assert.equal(JSON.stringify(timeline).includes("test-fixtures/cost-safe"), false);
          NODE
