name: Validate

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "test-fixtures/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "test-fixtures/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/validate.yml"

concurrency:
  group: ship-check-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Dogfood Ship Check against its own repository
        run: pnpm dogfood
      - name: Compile standalone engine
        run: bun build packages/cli/src/index.ts --compile --outfile dist/ship-check
      - name: Smoke standalone engine
        run: |
          ./dist/ship-check --version
          ./dist/ship-check scan ./test-fixtures/cost-safe --pack cost-aware --fail-on high
