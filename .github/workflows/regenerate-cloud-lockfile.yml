name: Regenerate Cloud lockfile

on:
  push:
    branches:
      - fix/cloud-vercel-workspace

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-vercel-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: regenerate Cloud workspace lockfile"
          git push origin HEAD:fix/cloud-vercel-workspace
