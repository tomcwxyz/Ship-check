name: Alpha 0.9 one-shot launch

on:
  push:
    branches: [main]
    paths:
      - "docs/ALPHA_TESTER_GUIDE.md"

permissions:
  contents: write
  actions: write

jobs:
  launch:
    if: "${{ github.event.head_commit.message == 'docs: finalise alpha 0.9 tester guide' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Alpha 0.9 release inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.0.0-alpha.9"
          test -f docs/ALPHA_TESTER_GUIDE.md

      - name: Publish desktop pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="ship-check-desktop-v0.0.0-alpha.9"
          guide="https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/ALPHA_TESTER_GUIDE.md"
          notes="Ship Check 0.0.0-alpha.9 is a small external alpha for testing the real end-to-end review and repair loop."
          notes+=$'\n\nStart with the alpha tester guide:\n'
          notes+="$guide"
          notes+=$'\n\nDesktop builds are available for Windows x64, Linux x64 and macOS Apple Silicon. Windows installers are unsigned and the macOS app is ad-hoc signed rather than notarised, so operating-system warnings may appear.'
          notes+=$'\n\nThe matching deterministic engine and pinned Gitleaks 8.30.0 binary are bundled. OSV-Scanner 2.5.1 is also bundled but its networked dependency lookup remains explicitly opt-in.'
          notes+=$'\n\nShip Check findings are evidence for human review, not a security or compliance certification.'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "Ship Check 0.0.0-alpha.9 · desktop alpha" --notes "$notes"

      - name: Dispatch npm Alpha 0.9 publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run npm-alpha-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=0.0.0-alpha.9 -f confirm=PUBLISH_ALPHA
