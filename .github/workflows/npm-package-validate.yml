name: NPM package validate

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/deep-checks/**"
      - "scripts/build-npm-package.mjs"
      - "scripts/install-deep-scanners.cjs"
      - "package.json"
      - ".github/workflows/npm-package-validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/deep-checks/**"
      - "scripts/build-npm-package.mjs"
      - "scripts/install-deep-scanners.cjs"
      - "package.json"
      - ".github/workflows/npm-package-validate.yml"

permissions:
  contents: read

concurrency:
  group: ship-check-npm-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            gitleaks: gitleaks
            osv: osv-scanner
          - os: windows-latest
            suffix: win32-x64
            gitleaks: gitleaks.exe
            osv: osv-scanner.exe
          - os: macos-14
            suffix: darwin-arm64
            gitleaks: gitleaks
            osv: osv-scanner

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Stage npm packages
        run: pnpm build:npm

      - name: Verify staged platform packages
        shell: bash
        env:
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
          GITLEAKS_BINARY: ${{ matrix.gitleaks }}
          OSV_BINARY: ${{ matrix.osv }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { access, readFile } from "node:fs/promises";
          import path from "node:path";

          const root = path.join("dist", "npm", "node_modules", "@good-ship");
          const main = path.join(root, "ship-check");
          const gitleaksPackage = path.join(root, `ship-check-gitleaks-${process.env.PLATFORM_SUFFIX}`);
          const osvPackage = path.join(root, `ship-check-osv-${process.env.PLATFORM_SUFFIX}`);
          const gitleaksBinary = path.join(gitleaksPackage, "bin", process.env.GITLEAKS_BINARY);
          const osvBinary = path.join(osvPackage, "bin", process.env.OSV_BINARY);

          await access(gitleaksBinary);
          await access(osvBinary);

          const manifest = JSON.parse(await readFile(path.join(main, "package.json"), "utf8"));
          assert.equal(
            manifest.optionalDependencies[`@good-ship/ship-check-gitleaks-${process.env.PLATFORM_SUFFIX}`],
            manifest.version
          );
          assert.equal(
            manifest.optionalDependencies[`@good-ship/ship-check-osv-${process.env.PLATFORM_SUFFIX}`],
            manifest.version
          );

          for (const binary of [gitleaksBinary, osvBinary]) {
            const result = spawnSync(path.resolve(binary), ["--version"], {
              encoding: "utf8",
              windowsHide: true
            });
            assert.equal(result.status, 0, `${binary} --version failed: ${result.stderr}`);
          }

          const cli = spawnSync(process.execPath, [path.join(main, "index.js"), "--version"], {
            encoding: "utf8",
            windowsHide: true
          });
          assert.equal(cli.status, 0, cli.stderr);
          NODE
