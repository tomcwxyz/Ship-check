name: NPM package validate

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/deep-checks/**"
      - "scripts/build-npm-package.mjs"
      - "scripts/install-deep-scanners.cjs"
      - "package.json"
      - ".github/workflows/npm-package-validate.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/deep-checks/**"
      - "scripts/build-npm-package.mjs"
      - "scripts/install-deep-scanners.cjs"
      - "package.json"
      - ".github/workflows/npm-package-validate.yml"

permissions:
  contents: read

concurrency:
  group: ship-check-npm-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            gitleaks: gitleaks
            osv: osv-scanner
          - os: windows-latest
            suffix: win32-x64
            gitleaks: gitleaks.exe
            osv: osv-scanner.exe
          - os: macos-14
            suffix: darwin-arm64
            gitleaks: gitleaks
            osv: osv-scanner

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Stage npm packages
        run: pnpm build:npm

      - name: Verify staged platform packages
        shell: bash
        env:
          PLATFORM_SUFFIX: ${{ matrix.suffix }}
          GITLEAKS_BINARY: ${{ matrix.gitleaks }}
          OSV_BINARY: ${{ matrix.osv }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { access, mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";

          const root = path.join("dist", "npm", "node_modules", "@good-ship");
          const main = path.join(root, "ship-check");
          const gitleaksPackage = path.join(root, `ship-check-gitleaks-${process.env.PLATFORM_SUFFIX}`);
          const osvPackage = path.join(root, `ship-check-osv-${process.env.PLATFORM_SUFFIX}`);
          const gitleaksBinary = path.join(gitleaksPackage, "bin", process.env.GITLEAKS_BINARY);
          const osvBinary = path.join(osvPackage, "bin", process.env.OSV_BINARY);

          await access(gitleaksBinary);
          await access(osvBinary);

          const manifest = JSON.parse(await readFile(path.join(main, "package.json"), "utf8"));
          assert.equal(
            manifest.optionalDependencies[`@good-ship/ship-check-gitleaks-${process.env.PLATFORM_SUFFIX}`],
            manifest.version
          );
          assert.equal(
            manifest.optionalDependencies[`@good-ship/ship-check-osv-${process.env.PLATFORM_SUFFIX}`],
            manifest.version
          );

          for (const binary of [gitleaksBinary, osvBinary]) {
            const result = spawnSync(path.resolve(binary), ["--version"], {
              encoding: "utf8",
              windowsHide: true
            });
            assert.equal(result.status, 0, `${binary} --version failed: ${result.stderr}`);
          }

          const cli = spawnSync(process.execPath, [path.join(main, "index.js"), "--version"], {
            encoding: "utf8",
            windowsHide: true
          });
          assert.equal(cli.status, 0, cli.stderr);

          const skillTarget = await mkdtemp(path.join(os.tmpdir(), "ship-check-skill-smoke-"));
          try {
            const installSkill = spawnSync(
              process.execPath,
              [path.join(main, "index.js"), "skill", "install", skillTarget],
              { encoding: "utf8", windowsHide: true }
            );
            assert.equal(installSkill.status, 0, installSkill.stderr);
            const installedSkill = await readFile(
              path.join(skillTarget, ".claude", "skills", "ship-check", "SKILL.md"),
              "utf8"
            );
            assert.match(installedSkill, /name: ship-check/);

            const installAgain = spawnSync(
              process.execPath,
              [path.join(main, "index.js"), "skill", "install", skillTarget],
              { encoding: "utf8", windowsHide: true }
            );
            assert.equal(installAgain.status, 0, installAgain.stderr);
            assert.match(installAgain.stdout, /already up to date/i);
          } finally {
            await rm(skillTarget, { recursive: true, force: true });
          }

          const fixture = await mkdtemp(path.join(os.tmpdir(), "ship-check-gitleaks-smoke-"));
          const synthetic = "ghp_" + "aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789";
          try {
            await writeFile(path.join(fixture, "config.js"), `const token = "${synthetic}";\n`);
            const scan = spawnSync(
              process.execPath,
              [path.join(main, "index.js"), "scan", fixture, "--pack", "secure-build", "--format", "json"],
              { encoding: "utf8", windowsHide: true, maxBuffer: 16 * 1024 * 1024 }
            );
            assert.equal(scan.status, 0, scan.stderr);
            const report = JSON.parse(scan.stdout);
            const secretCheck = report.checks.find((check) => check.checkId === "secure.secret-pattern");
            assert.ok(secretCheck, "Expected Gitleaks secret check");
            assert.match(secretCheck.scannerVersion ?? "", /8\.30\.0/);
            assert.ok(
              report.findings.some((finding) => finding.checkId === "secure.secret-pattern"),
              "Pinned Gitleaks must detect the synthetic acceptance credential"
            );
            assert.equal(scan.stdout.includes(synthetic), false, "Scanner output must not echo the matched secret");
          } finally {
            await rm(fixture, { recursive: true, force: true });
          }
          NODE
