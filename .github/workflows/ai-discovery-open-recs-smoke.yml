name: ai-discovery-open-recs-smoke

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/ai-discovery-open-recs-smoke.yml"
      - "packages/core/src/aiDiscovery.ts"
      - "packages/core/test/aiDiscovery.test.ts"
      - "packages/core/package.json"
      - "packages/cli/src/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-open-recs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --no-frozen-lockfile
      - name: Build Ship Check
        run: pnpm build
      - name: Run bounded discovery against Open Recommendations Local
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js discover-ai tomcwxyz/open-recs-local --ref master > /tmp/open-recs-discovery.json
          jq -e '
            .format == "crux-discovery/0.1" and
            .source.provider == "ship-check" and
            ([.signals[].kind] | index("ai_sdk")) != null and
            ([.signals[].kind] | index("model_call")) != null and
            ([.signals[] | select(.workflow_hint == "source.extract" and .kind == "model_call" and (.evidence[0].path | startswith("src/")))] | length) > 0 and
            ([.signals[] | select(.workflow_hint == "chat.search" and .kind == "model_call" and (.evidence[0].path | startswith("src/")))] | length) > 0 and
            ([.signals[].evidence[].path // "" | select(endswith(".md"))] | length) == 0 and
            ([.signals[].evidence[].path // "" | select(test("(^|/)(tests?|__tests__|fixtures?)(/|$)|\\.(test|spec)\\."))] | length) == 0 and
            (.signals | length) <= 12 and
            (has("purpose") | not) and
            (has("people_affected") | not) and
            (has("authority") | not)
          ' /tmp/open-recs-discovery.json >/dev/null
          echo "=== OPEN RECS DISCOVERY REPORT ==="
          cat /tmp/open-recs-discovery.json


  discover-soundings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: pnpm install --no-frozen-lockfile
      - name: Build Ship Check
        run: pnpm build
      - name: Run bounded discovery against Soundings
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js discover-ai tomcwxyz/soundings --ref main > /tmp/soundings-discovery.json
          jq -e '
            .format == "crux-discovery/0.1" and
            .source.provider == "ship-check" and
            ([.signals[] | select(.workflow_hint == "ask" and .kind == "ai_provider" and .technology == "anthropic" and (.evidence[0].path | startswith("server/soundings/ask/")))] | length) > 0 and
            ([.signals[] | select(.workflow_hint == "ask" and .kind == "model_call" and .technology == "anthropic" and (.evidence[0].path | startswith("server/soundings/ask/")))] | length) > 0 and
            ([.signals[].evidence[].path // "" | select(endswith(".md"))] | length) == 0 and
            ([.signals[].evidence[].path // "" | select(test("(^|/)(tests?|__tests__|fixtures?)(/|$)|(^|/)(test_[^/]+|[^/]+_test)\\.py$"))] | length) == 0 and
            (has("purpose") | not) and
            (has("people_affected") | not) and
            (has("authority") | not)
          ' /tmp/soundings-discovery.json >/dev/null
          echo "=== SOUNDINGS DISCOVERY REPORT ==="
          cat /tmp/soundings-discovery.json
