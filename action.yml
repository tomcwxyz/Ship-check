name: Ship Check
description: Run Ship Check inside the caller's GitHub Actions runner without sending source to Ship Check infrastructure.
author: The Good Ship

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Repository-relative project directory to scan.
    required: false
    default: "."
  packs:
    description: "Comma- or space-separated packs: secure-build, production-ready, cost-aware."
    required: false
    default: "secure-build,production-ready,cost-aware"
  fail-on:
    description: Fail the action when an active finding reaches this severity. Use never to report only.
    required: false
    default: "high"
  report-path:
    description: Repository-relative path for the JSON report.
    required: false
    default: ".ship-check/report.json"
  deployment-url:
    description: Optional deployed URL to add bounded runtime evidence to the source review.
    required: false
    default: ""
  networked-dependency-scan:
    description: Opt into the OSV networked dependency check. Requires production-ready.
    required: false
    default: "false"
  pr-comparison:
    description: On pull_request events, compare source evidence with the exact base commit inside the same runner.
    required: false
    default: "true"

outputs:
  report-path:
    description: Repository-relative path to the generated JSON report.
    value: ${{ steps.scan.outputs.report-path }}
  exit-code:
    description: Ship Check threshold exit code before the action gate is applied.
    value: ${{ steps.scan.outputs.exit-code }}
  finding-count:
    description: Number of active findings in the report.
    value: ${{ steps.scan.outputs.finding-count }}
  unverified-count:
    description: Number of active unanswered controls in the report.
    value: ${{ steps.scan.outputs.unverified-count }}
  snapshot-completeness:
    description: complete, partial or unknown source fingerprint state.
    value: ${{ steps.scan.outputs.snapshot-completeness }}
  ruleset-fingerprint:
    description: SHA-256 fingerprint of the selected check IDs, rule versions and packs.
    value: ${{ steps.scan.outputs.ruleset-fingerprint }}
  comparison-status:
    description: compared, unavailable, disabled or not-applicable.
    value: ${{ steps.scan.outputs.comparison-status }}
  new-finding-count:
    description: Active findings introduced relative to the pull request base.
    value: ${{ steps.scan.outputs.new-finding-count }}
  reactivated-finding-count:
    description: Findings that were accepted at the base and are active again.
    value: ${{ steps.scan.outputs.reactivated-finding-count }}
  accepted-finding-count:
    description: Base active findings that are now explicitly accepted exceptions.
    value: ${{ steps.scan.outputs.accepted-finding-count }}
  no-longer-active-finding-count:
    description: Base active findings that are no longer active in the current source scan.
    value: ${{ steps.scan.outputs.no-longer-active-finding-count }}
  new-unverified-count:
    description: Unanswered controls introduced relative to the pull request base.
    value: ${{ steps.scan.outputs.new-unverified-count }}
  no-longer-active-unverified-count:
    description: Base unanswered controls that are no longer active in the current source scan.
    value: ${{ steps.scan.outputs.no-longer-active-unverified-count }}
  new-surface-count:
    description: Newly observed inventory surfaces relative to the pull request base.
    value: ${{ steps.scan.outputs.new-surface-count }}

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.12.0"

    - name: Prepare Ship Check
      shell: bash
      run: |
        pnpm --dir "$GITHUB_ACTION_PATH" install --frozen-lockfile
        pnpm --dir "$GITHUB_ACTION_PATH" build

    - name: Run Ship Check
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PACKS: ${{ inputs.packs }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_DEPLOYMENT_URL: ${{ inputs.deployment-url }}
        INPUT_NETWORKED_DEPENDENCY_SCAN: ${{ inputs.networked-dependency-scan }}
        INPUT_PR_COMPARISON: ${{ inputs.pr-comparison }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.mjs"

    - name: Apply Ship Check gate
      shell: bash
      env:
        SHIP_CHECK_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        code="${SHIP_CHECK_EXIT_CODE:-1}"
        if [ "$code" -ne 0 ]; then
          echo "Ship Check crossed the configured CI threshold (exit code $code)." >&2
          exit "$code"
        fi
